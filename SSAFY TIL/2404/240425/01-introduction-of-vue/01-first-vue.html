<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <!-- 선언적 렌더링, 템플릿 구문 사용 -->
    <!-- javascript 상태를 기반으로 화면에 출력될 HTML을 선억적으로 작성 -->

    <!-- 반응성 : 자바스크립트 상태 변경을 추적하고 자동으로 Dom 상태 변경 -->
    <h1>{{message}}</h1>
    <button @click="count++">카운팅 : {{count}}</button>
  </div>

  <!-- mounting이 안 된 영역에서는 vue가 영향을 미치지 못함 출력 불가 -->
  <!-- <h1>{{message}}</h1> -->

  
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    // 구조 분해 할당으로 함수를 아래와 같이 할당할 수 있음
    const {createApp, ref} = Vue

    // 객체를 인자로 받음
    const app = createApp({
      setup() {
        const message = ref('Hello Vue!')
        const count = ref(0)

        return {
          // message : message,
          message,
          count
        }
      }
    })

    // 영역 연결
    app.mount('#app')
  </script>
</body>

</html>
