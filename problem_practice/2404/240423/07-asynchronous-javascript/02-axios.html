<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const URL = 'https://api.thecatapi.com/v1/images/search'

    // 1.
    const promiseObj = axios({
      method : 'get',
      // response = request.get(URL)과 동일
      url : URL,
    })
    console.log(promiseObj)
    
    // 콜백함수로 받아옴
    promiseObj.then((response) => {
      // PromiseResult 
      console.log(response)
      console.log(response.data)
      // 요청 응답이 아무리 빨라도 이 로직을 채우는데 시간이 걸림
      // webAPI로 보내진 것
      // return response.data
      console.log(response.data[0].url)
      // 이어서 chaining할 수 있음
    })//.then((response)=> {})

    // cat api로 보낸 요청에 대한 응답을 기다리지 않고 console.log를 찍음
    console.log('hahahah')

    // 2. promiseObj.then과 동일함

    axios({
      method : 'get',
      // response = request.get(URL)과 동일
      url : URL,
    })
      .then((response)=>{
        console.log(response)
        console.log(response.data)
        console.log(response.data[0].url)
    })
    
    // catch는 then에서 문제가 발생하면 실행되는 코드

  </script>

</body>

</html>
