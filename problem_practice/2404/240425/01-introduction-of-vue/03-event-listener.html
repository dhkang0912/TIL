<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <p>{{count}}</p>
    <p>{{count}}</p>
    <p>{{count}}</p>
    <p>{{count}}</p>
    <p>{{count}}</p>
    <p>{{count}}</p>
    <p>{{count}}</p>
    <p>{{count}}</p>
    <p>{{count}}</p>
    <button v-on:click="increment">버튼!! </button>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>

    // 약속을 미리 세팅하고 가는 걸 추천함
    const {createApp, ref} = Vue 
    const app = createApp({

      setup() {
        const count = ref(0)

        const increment = function () {
          // ref 객체 안의 .value를 해야 안의 값을 증가 가능, 이름만 적으면 ref 객체
          count.value ++
        }

        // 자주 빼먹음, 객체로 리턴을 해야함 (반응형 변수, 함수 모두 넣어야 함)
        return {
          count,
          increment, 
        }
      }
    })

    app.mount('#app')
  </script>
</body>

</html>
