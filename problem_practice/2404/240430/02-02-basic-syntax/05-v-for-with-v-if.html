<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <!-- [Bad] v-for with v-if -->
    <!-- v-for와 v-if를 함께 쓰면 안됨, v-if가 먼저 평가됨 -->
    <!-- Uncaught TypeError: Cannot read properties of undefined (reading 'isComplete') -->
    <!-- todo가 정의되지 않은 것으로 봄 -->
    <!-- <ul >
      <li v-for="todo in todos" v-if="todo.isComplete === false" :key="todo.id">
        {{todo.name}}
      </li>
    </ul> -->

    <!-- [Good 1] v-for with v-if (computed)-->
    <ul>
      <li v-for="todo in completeTodos" :key="todo.id">
        {{todo.name}}
      </li>
    </ul>

    <!-- [Good 2] v-for with v-if -->
    <ul>
      <template v-for="todo in todos" :key="todo.id">
        <li v-if="todo.isComplete === false">
          {{todo.name}}
        </li>
      </template>
    </ul>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref, computed } = Vue

    const app = createApp({
      setup() {
        let id = 0

        const todos = ref([
          { id: id++, name: '복습', isComplete: true },
          { id: id++, name: '예습', isComplete: false },
          { id: id++, name: '저녁식사', isComplete: true },
          { id: id++, name: '노래방', isComplete: false }
        ])
        
        // 이미 v-if를 해서 나올 결과를 만들어서 저장해놓음
        const completeTodos = computed(() => {
          return todos.value.filter((todo) => !todo.isComplete)
        })

        return {
          todos,
          completeTodos
        }
      }
    })

    app.mount('#app')
  </script>
</body>

</html>
