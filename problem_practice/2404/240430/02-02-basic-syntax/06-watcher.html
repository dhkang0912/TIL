<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <!-- 1 -->
    <button @click="count++">Add 1</button>
    <p>Count: {{ count }}</p>

    <!-- 2 -->
    <input v-model="message">
    <p>Message length: {{ messageLength }}</p>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref, watch } = Vue

    const app = createApp({
      setup() {
        const count = ref(0)
        const message = ref('')
        const messageLength = ref(0)

        // 첫번째 인자 = 감시 대상
        // watch의 경우 데이터 변화에 따른 특정 작업을 수행, DOM 변경, 다른 비동기 작업 수행, 외부 api와 연동 등, axios와 함께 쓰임
        watch(count, (newValue, oldValue) =>{
          console.log(`변화된 값 : ${newValue} / 변화 전 값 : ${oldValue}`)
        })

        // 여러개 감시하고 싶은 경우 배열로 넣음, old, new value도 배열로 나옴
        watch(message, (newValue) => {
          messageLength.value = newValue.length
        })

        return {
          count,
          message,
          messageLength
        }
      }
    })

    app.mount('#app')
  </script>
</body>

</html>
